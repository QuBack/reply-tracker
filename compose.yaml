services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app-data:/data
    environment:
      WEB_TRUSTED_HOSTS: ${WEB_TRUSTED_HOSTS:-localhost,127.0.0.1}
      WEB_SECURE_COOKIES: ${WEB_SECURE_COOKIES:-0}
      WEB_ALLOW_REGISTRATION: ${WEB_ALLOW_REGISTRATION:-0}
      WEB_TRUSTED_PROXY: ${WEB_TRUSTED_PROXY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${chatgpt_api:-}}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-openai}
      OPENAI_SEARCH_MODEL: ${OPENAI_SEARCH_MODEL:-gpt-6-luna}
      OPENAI_SEARCH_BUDGET_USD: ${OPENAI_SEARCH_BUDGET_USD:-5}
      CODEX_SEARCH_URL: http://search:8090/search
      CODEX_GATEWAY_TOKEN: ${CODEX_GATEWAY_TOKEN:-}
    restart: unless-stopped
    init: true
  search:
    profiles: [codex]
    build:
      context: .
      target: search
    volumes:
      - codex-auth:/codex
    environment:
      CODEX_GATEWAY_TOKEN: ${CODEX_GATEWAY_TOKEN:-}
    restart: unless-stopped
    init: true
volumes:
  app-data:
  codex-auth:
